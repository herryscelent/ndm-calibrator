[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "NDM-Calibrator"
version = "1.0.0"
description = "非线性动态模型参数辨识与校准软件 (Nonlinear Dynamic Model parameter identification and calibration)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "sympy>=1.11",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-qt>=4.4"]

[tool.setuptools]
packages = ["app", "core", "data", "simulation", "identification", "diagnostics", "uncertainty", "visualization", "export", "ui", "ui_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
